# A cada hora, traz do boralula.org as ações já mapeadas (ja-mapeadas/acoes.csv), para quem envia conferir repetidas.
name: Atualizar ações já mapeadas

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atualizar-mapeadas
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar a lista pública
        run: python ferramentas/atualizar_mapeadas.py

      - name: Gravar se mudou
        run: |
          git add ja-mapeadas/acoes.csv
          if git diff --cached --quiet; then
            echo "Nada mudou."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "ja-mapeadas: atualização automática"
          git push
