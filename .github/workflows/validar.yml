# Confere os arquivos de ações (CSV ou JSON) de cada pull request. O validador que roda é o da main (base), nunca o do pull request:
# quem envia não consegue mudar a regra que confere o próprio envio.
name: Conferir ações

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  conferir:
    runs-on: ubuntu-latest
    steps:
      - name: Validador da main
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: Arquivos do pull request
        uses: actions/checkout@v5
        with:
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Conferir os arquivos de ações
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          # Branch no próprio repositório só quem tem permissão de escrita cria; quem é de fora envia de um fork
          DE_DENTRO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          git -C pr -c core.quotepath=off diff --name-status "$BASE" HEAD > alteracoes.txt
          cat alteracoes.txt
          EQUIPE=""
          if [ "$DE_DENTRO" = "true" ]; then EQUIPE="--equipe"; fi
          python base/ferramentas/validar.py --raiz pr --alteracoes alteracoes.txt $EQUIPE

      - name: Testes (pull request da equipe)
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: python -m unittest discover pr/testes
